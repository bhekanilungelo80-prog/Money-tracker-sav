<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Money Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #172033;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #166534;
}

.balance {
    background: #166534;
    color: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
}

.balance h2 {
    font-size: 32px;
}

.cards {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.card {
    background: white;
    padding: 15px;
    flex: 1;
    border-radius: 12px;
    text-align: center;
}

.income {
    color: green;
}

.expense {
    color: red;
}

form {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

input, select, button {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    background: #166534;
    color: white;
    border: none;
    cursor: pointer;
}

.transaction {
    background: white;
    margin-top: 10px;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.delete {
    background: #dc2626;
    width: auto;
    padding: 8px;
}

</style>
</head>

<body>

<div class="container">

<h1>💰 My Money Tracker</h1>

<div class="balance">
    <p>Available Balance</p>
    <h2 id="balance">E0.00</h2>
</div>

<div class="cards">
    <div class="card">
        <p>Income</p>
        <h3 class="income" id="income">E0.00</h3>
    </div>

    <div class="card">
        <p>Expenses</p>
        <h3 class="expense" id="expense">E0.00</h3>
    </div>
</div>

<h3>➕ Add Transaction</h3>

<form id="form">

    <input
        type="text"
        id="description"
        placeholder="Description (e.g. Salary)"
        required
    >

    <input
        type="number"
        id="amount"
        placeholder="Amount in Emalangeni (E)"
        min="0.01"
        step="0.01"
        required
    >

    <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
    </select>

    <select id="category">
        <option>Salary</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Business</option>
        <option>Other
